apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medusa-staging
  namespace: argocd
spec:
  destination:
    namespace: staging
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/invine/my-medusa-store.git
    targetRevision: main
    path: charts/medusa
    helm:
      valueFiles:
        - values-staging.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
