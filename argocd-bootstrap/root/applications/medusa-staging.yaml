apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medusa-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: staging
    server: https://kubernetes.default.svc
  project: application-workloads
  source:
    repoURL: https://github.com/invine/my-medusa-store
    targetRevision: main
    path: charts/medusa
    helm:
      valueFiles:
        - values-staging.yaml
