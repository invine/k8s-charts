apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openvpn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: openvpn
    server: https://kubernetes.default.svc
  project: application-workloads
  source:
    helm:
      parameters:
        - name: image.tag
          value: 2.6.12
        - name: backup.ttl
          value: "720h0m0s"
    path: openvpn-chart
    repoURL: https://github.com/invine/k8s-charts
    targetRevision: main
