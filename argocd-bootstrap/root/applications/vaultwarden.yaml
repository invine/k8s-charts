apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: vaultwarden
    server: https://kubernetes.default.svc
  project: application-workloads
  source:
    helm:
      parameters:
        - name: service.ingress.host
          value: vaultwarden.everk8s.duckdns.org
        - name: image.tag
          value: 1.37.1
        - name: service.ingress.issuer
          value: letsencrypt-prod
        - name: backup.ttl
          value: "720h0m0s"
        - name: adminTokenSecret.enable
          value: "true"
    path: vaultwarden-chart
    repoURL: https://github.com/invine/k8s-charts
    targetRevision: main
