name: "echo-app"

replicaCount: 1

image:
  repository: ghcr.io/invine/echo
  tag: main

namespace: echo

env:
  logLevel: "debug"

# F5 NGINX supplies dedicated identity headers from OCI PROXY protocol.
# Enable only with an image supporting TRUSTED_PROXY_CIDRS (v0.0.4 or later).
clientIdentity:
  enabled: false
  # Trust includes ALL callers from these networks, not just ingress pods.
  trustedProxyCidrs: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  ingress:
    ingressClassName: nginx
    host: echo.example.com
    path: /
    backend:
      service: echo-service
    issuer: letsencrypt-staging
backup:
  veleroNamespace: "velero"
  schedule: "0 0 * * *" # Every day
  ttl: "168h0m0s" # 1 hour
  snapshotVolumes: false
